name: Weekly Fantasy Posts

on:
  schedule:
    - cron: "0 16 * * 2"   # Tuesday 16:00 UTC — Awards + Power Rankings
    - cron: "0 22 * * 4"   # Thursday 22:00 UTC — Matchup Preview
  workflow_dispatch:
    inputs:
      run_preview:
        description: "Also post the matchup preview now"
        required: false
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: Tuesday (Awards + Power)
        if: ${{ github.event.schedule == '0 16 * * 2' || (github.event_name == 'workflow_dispatch' && inputs.run_preview != true) }}
        env:
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          SEASON_ID: ${{ secrets.SEASON_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          TIMEZONE: ${{ secrets.TIMEZONE }}
        run: |
          python weekly_awards.py
          python weekly_power.py

      - name: Thursday (Preview)
        if: ${{ github.event.schedule == '0 22 * * 4' || (github.event_name == 'workflow_dispatch' && inputs.run_preview == true) }}
        env:
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          SEASON_ID: ${{ secrets.SEASON_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          TIMEZONE: ${{ secrets.TIMEZONE }}
        run: python weekly_preview.py
